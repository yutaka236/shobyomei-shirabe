<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5d7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="傷病名調べ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2">

<title>傷病名調べ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 検索バーを最上部に固定、結果は「大分類 › 中分類 › 小分類」の階層表示。章ごとの色帯で位置を示す */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#17212b; --muted:#5b6876; --line:#d9e0e7;
  --accent:#0b5d7a; --accent-soft:#e1f0f5; --mark:#ffe58a; --warn:#8a5a00; --warn-bg:#fff4d6;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#17212a; --fg:#e6edf3; --muted:#9aa8b6; --line:#2a3743;
  --accent:#62b8d6; --accent-soft:#14323d; --mark:#6b5a12; --warn:#f0c264; --warn-bg:#2d2610; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#17212a; --fg:#e6edf3; --muted:#9aa8b6; --line:#2a3743;
  --accent:#62b8d6; --accent-soft:#14323d; --mark:#6b5a12; --warn:#f0c264; --warn-bg:#2d2610; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-block:0 calc(48px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
header{padding-top:12px}
h1{font-size:19px;margin:0 0 2px;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 6px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0 8px;z-index:5;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.field{position:relative}
input[type=search]{width:100%;min-height:48px;font:inherit;font-size:17px;padding:12px 44px 12px 14px;-webkit-appearance:none;appearance:none;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]::-webkit-search-cancel-button{display:none}
.clr{position:absolute;right:0;top:0;width:48px;height:48px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.clr[hidden]{display:none}
input[type=search]:focus-visible{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.chips{display:flex;gap:8px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:14px;min-height:36px;padding:4px 14px;white-space:nowrap;flex:none;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--fg);cursor:pointer}
.hist-h{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.hist-h .btn{min-height:32px;padding:2px 10px;font-size:12px}
.hist-empty{font-size:13px;color:var(--muted);margin-top:6px}
.chips{flex-wrap:wrap;overflow:visible}
.chip:hover,.chip:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.count{color:var(--muted);font-size:13px;margin:10px 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.path{display:grid;gap:6px}
.lv{display:grid;grid-template-columns:3.2em 1fr;gap:6px;align-items:baseline;min-width:0}
.lv .tag{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.lv .txt{min-width:0;overflow-wrap:anywhere}
.code{font-family:var(--mono);font-size:13px;color:var(--accent);margin-right:6px;white-space:nowrap}
.l1 .code,.l2 .code{display:block;margin:0}
.l3 .txt{font-weight:700;font-size:17px;line-height:1.45}
.l1 .txt,.l2 .txt{font-size:13px;color:var(--muted)}
.l2{padding-left:10px;border-left:2px solid var(--line)}
.l3{padding-left:20px;border-left:2px solid var(--accent)}
.actions{margin-top:8px;display:flex;gap:8px}
.btn{font:inherit;font-size:14px;min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--muted);cursor:pointer}
.btn:hover,.btn:focus-visible{color:var(--accent);border-color:var(--accent);outline:none}
mark{background:var(--mark);color:inherit;border-radius:2px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 12px;font-size:12.5px;margin-top:20px}
.more{width:100%;min-height:48px}
details{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
summary{cursor:pointer;padding:12px 14px;min-height:48px;font-weight:500;line-height:1.4}
summary .code{display:block;margin-bottom:2px}
summary .code{margin-right:8px}
.blk{padding:0 14px 8px}
.blk h3{font-size:13px;margin:14px 0 4px;color:var(--muted);font-weight:500}
.blk ul{margin:0;padding:0;list-style:none}
.blk li{padding:10px 0 10px 12px;min-height:44px;border-left:2px solid var(--line);font-size:14px;cursor:pointer}
.blk li:hover{border-left-color:var(--accent);color:var(--accent)}
.h2{font-size:14px;margin:22px 0 8px;color:var(--muted);font-weight:500}
.empty{color:var(--muted);padding:16px 0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>傷病名調べ</h1>
  <p class="sub">入力すると、大分類・中分類・小分類を表示します。</p>
</header>
<div class="bar">
  <div class="field"><input id="q" type="search" placeholder="傷病名・コード（例：心筋梗塞、I21）" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" inputmode="search" aria-label="傷病名またはICDコード"><button id="clr" class="clr" type="button" aria-label="入力を消す" hidden>✕</button></div>
  <div class="hist-h" id="histh" hidden><span>検索履歴（新しい順・最大10件）</span><button id="histclr" class="btn" type="button">履歴を消す</button></div>
  <div class="chips" id="chips"></div>
  <div class="hist-empty" id="histe">検索した語はここに履歴として残ります。</div>
</div>
<div id="count" class="count" aria-live="polite"></div>
<div id="results"></div>
<h2 class="h2">章から探す</h2>
<div id="browse"></div>
<div class="note">収録範囲：ICD-10（2013年版）の22章・中分類・小分類（3桁分類）。4桁の細分類は未収録です。外因（V〜Y章）は代表的な3桁分類のみで、全項目ではありません。実務の診断・コーディングには、厚生労働省または公式の分類表で必ず確認してください。「熱中症」などの通称は、近い分類へ導く検索補助として登録しています。</div>
</div>

const CH = DATA.ch, BL = DATA.bl, CA = DATA.ca, SYN = DATA.syn;
const $ = id => document.getElementById(id);
const norm = s => s.normalize("NFKC").toLowerCase()
  .replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0)+0x60))
  .replace(/[<>＜＞\[\]［］()（）\s・,，、]/g, "");
const inRange = (code, range) => { const [a,b] = range.split("-"); return code >= a && code <= b; };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean = s => s.replace(/[<>]/g, m => m); // 表示は原文のまま

CA.forEach(c => {
  c.n = norm(c.name);
  c.block = BL.find(b => inRange(c.code, b.r));
  c.chap = CH.find(h => inRange(c.code, h.r));
});

function hl(text, q){
  const t = esc(text); if(!q) return t;
  // 正規化前の文字列でも一致する範囲だけ強調
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return t;
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
}

function card(c, q){
  const el = document.createElement("div"); el.className = "card";
  const path = `${c.chap.no}章 ${c.chap.name} › ${c.block.r} ${c.block.name} › ${c.code} ${c.name}`;
  el.innerHTML = `<div class="path">
    <div class="lv l1"><span class="tag">大分類</span><span class="txt"><span class="code">第${c.chap.no}章 ${c.chap.r}</span>${esc(c.chap.name)}</span></div>
    <div class="lv l2"><span class="tag">中分類</span><span class="txt"><span class="code">${c.block.r}</span>${esc(c.block.name)}</span></div>
    <div class="lv l3"><span class="tag">小分類</span><span class="txt"><span class="code">${c.code}</span>${hl(c.name,q)}</span></div></div>
    <div class="actions"><button class="btn" type="button">経路をコピー</button></div>`;
  el.querySelector(".btn").onclick = async e => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText(path); b.textContent = "コピーしました"; }
    catch(_){ const r = document.createRange(); r.selectNodeContents(el.querySelector(".l3 .txt")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "選択しました"; }
    setTimeout(()=>b.textContent="経路をコピー",1500);
  };
  return el;
}

let limit = 30, lastQ = "";
function search(raw){
  const q = norm(raw);
  const out = $("results"), cnt = $("count");
  out.innerHTML = "";
  if(!q){ cnt.textContent = ""; return; }
  const scored = new Map();
  const add = (c, s) => { if(!scored.has(c) || scored.get(c) < s) scored.set(c, s); };
  const codeQ = raw.normalize("NFKC").trim().toUpperCase().replace(/\..*$/, "");
  const isCode = /^[A-Z]\d{0,2}$/.test(codeQ);
  const tokens = raw.normalize("NFKC").trim().split(/\s+/).map(norm).filter(Boolean);
  let synNote = "";
  CA.forEach(c => {
    if(isCode){ if(c.code === codeQ) add(c,100); else if(c.code.startsWith(codeQ)) add(c,60); }
    if(tokens.every(t => c.n.includes(t))){
      add(c, c.n === q ? 90 : c.n.startsWith(q) ? 70 : 50);
    } else if(tokens.every(t => (c.n + norm(c.block.name)).includes(t))){
      add(c, 20);
    } else if(tokens.every(t => (c.n + norm(c.block.name) + norm(c.chap.name)).includes(t)) && tokens.join("").length >= 2){
      add(c, 5);
    }
  });
  for(const [k, v] of Object.entries(SYN)){
    if(q.includes(norm(k))){
      v.codes.forEach(code => { const c = CA.find(x => x.code === code); if(c) add(c, 95); });
      synNote = `「${k}」は ${v.codes.join("・")} に分類されます。${v.note||""}`;
    }
  }
  const list = [...scored.entries()].sort((a,b)=> b[1]-a[1] || (a[0].code < b[0].code ? -1 : 1)).map(x=>x[0]);
  cnt.textContent = list.length ? `${list.length}件${synNote ? "　" + synNote : ""}` : "";
  if(!list.length){ out.innerHTML = `<div class="empty">「${esc(raw)}」に一致する分類がありません。別の表記（例：「心筋梗塞」→「心筋」）や、病名の一部で試してください。</div>`; return; }
  list.slice(0, limit).forEach(c => out.appendChild(card(c, raw.normalize("NFKC").trim())));
  if(list.length > limit){
    const b = document.createElement("button"); b.className = "btn more"; b.type = "button";
    b.textContent = `さらに表示（残り${list.length - limit}件）`;
    b.onclick = () => { limit += 30; search($("q").value); };
    out.appendChild(b);
  }
}

$("q").addEventListener("input", e => { $("clr").hidden = !e.target.value; if(e.target.value !== lastQ){ limit = 30; lastQ = e.target.value; } search(e.target.value); });
const HK = "shobyomei-history-v1";
let hist = [];
try { hist = JSON.parse(localStorage.getItem(HK) || "[]").filter(x => typeof x === "string").slice(0,10); } catch(_){ hist = []; }
function saveHist(){ try { localStorage.setItem(HK, JSON.stringify(hist)); } catch(_){} }
function renderHist(){
  const box = $("chips"); box.innerHTML = "";
  hist.forEach(w => {
    const b = document.createElement("button"); b.className = "chip"; b.type = "button"; b.textContent = w;
    b.onclick = () => { $("q").value = w; $("clr").hidden = false; lastQ = w; limit = 30; search(w); addHist(w); };
    box.appendChild(b);
  });
  $("histh").hidden = !hist.length; $("histe").hidden = !!hist.length;
}
function addHist(w){
  w = w.trim(); if(!w) return;
  hist = [w, ...hist.filter(x => x !== w)].slice(0,10); saveHist(); renderHist();
}
let hTimer;
function queueHist(){
  clearTimeout(hTimer);
  const w = $("q").value.trim();
  if(w.length < 1) return;
  hTimer = setTimeout(() => { if($("results").querySelector(".card") && $("q").value.trim() === w) addHist(w); }, 1500);
}
$("q").addEventListener("input", queueHist);
$("q").addEventListener("blur", () => { clearTimeout(hTimer); const w = $("q").value.trim(); if(w && $("results").querySelector(".card")) addHist(w); });
$("histclr").onclick = () => { hist = []; saveHist(); renderHist(); };
renderHist();
$("clr").onclick = () => { const q = $("q"); q.value = ""; lastQ = ""; $("clr").hidden = true; search(""); q.focus(); };
$("q").addEventListener("keydown", e => { if(e.key === "Enter") e.target.blur(); });
$("results").addEventListener("touchstart", () => { if(document.activeElement === $("q")) $("q").blur(); }, {passive:true});
// 章から探す
const br = $("browse");
CH.forEach(h => {
  const d = document.createElement("details");
  const blocks = BL.filter(b => inRange(b.r.split("-")[0], h.r) && inRange(b.r.split("-")[1], h.r));
  d.innerHTML = `<summary><span class="code">第${h.no}章 ${h.r}</span>${esc(h.name)}</summary><div class="blk"></div>`;
  let filled = false;
  d.addEventListener("toggle", () => {
    if(!d.open || filled) return; filled = true;
    const box = d.querySelector(".blk");
    blocks.forEach(b => {
      const cats = CA.filter(c => c.block === b);
      const h3 = document.createElement("h3"); h3.innerHTML = `<span class="code">${b.r}</span>${esc(b.name)}`; box.appendChild(h3);
      const ul = document.createElement("ul");
      cats.forEach(c => { const li = document.createElement("li"); li.innerHTML = `<span class="code">${c.code}</span>${esc(c.name)}`;
        li.onclick = () => { $("q").value = c.code; $("clr").hidden = false; lastQ = c.code; search(c.code); scrollTo({top:0,behavior:"smooth"}); }; ul.appendChild(li); });
      box.appendChild(ul);
    });
  });
  br.appendChild(d);
});
</script>
<script>if("serviceWorker"in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
